<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Radio AI</title>

<style>
body {
    background: black;
    color: white;
    text-align: center;
    font-family: sans-serif;
    margin-top: 80px;
}

h1 {
    font-size: 42px;
    margin-bottom: 10px;
}

h2 {
    font-weight: normal;
    opacity: 0.8;
}

.credit {
    margin-top: 30px;
    font-size: 18px;
    opacity: 0.65;
    line-height: 1.8;
}

/* ---------- CHAT ---------- */

.chat-box {
    margin: 40px auto;
    max-width: 700px;
    text-align: right;
}

.message {
    margin: 12px 0;
    padding: 14px;
    border-radius: 10px;
    background: #111;
    line-height: 1.9;
}

.user {
    background: #1a1a1a;
}

.ai {
    background: #0f0f0f;
    border-right: 3px solid #ffffff33;
}

.input-area {
    margin-top: 40px;
}

input {
    padding: 12px;
    width: 60%;
    font-size: 16px;
    border: none;
    border-radius: 6px;
}

button {
    padding: 12px 20px;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: white;
    color: black;
}
</style>
</head>

<body>

<h1>🎙️ اولین رادیوی هوش مصنوعی در جهان</h1>

<h2 id="status">در حال اتصال به رادیو...</h2>

<div class="credit">
    <div>طراح: <strong>سعید بهادری</strong></div>
    <div>سفارش پروژه: <strong>زهرا قاعدی</strong></div>
</div>


<!-- ================= CHAT UI ================= -->

<div class="input-area">
    <input id="message" placeholder="موضوع برنامه را بنویسید..." />
    <button onclick="sendMessage()">پخش</button>
</div>

<div id="chat" class="chat-box"></div>


<script>

/* ---------- STATUS ---------- */
async function checkStatus() {
    try {
        const res = await fetch("/api/status");
        const data = await res.json();
        document.getElementById("status").innerText =
            "وضعیت رادیو: " + data.radio;
    } catch {
        document.getElementById("status").innerText =
            "ارتباط با رادیو برقرار نشد";
    }
}
checkStatus();


/* ---------- ENTER KEY SEND ---------- */
document.getElementById("message")
.addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        sendMessage();
    }
});


/* ---------- TYPEWRITER EFFECT ---------- */
function typeWriter(text, element){

    let i = 0;

    function typing(){
        if(i < text.length){
            element.innerHTML += text.charAt(i);
            i++;
            setTimeout(typing, 18);
        }
    }

    typing();
}


/* ---------- CHAT ---------- */
async function sendMessage() {

    const input = document.getElementById("message");
    const chat = document.getElementById("chat");

    const text = input.value.trim();
    if (!text) return;

    // پیام کاربر
    chat.innerHTML += `
        <div class="message user"><b>🎧 شما:</b> ${text}</div>
    `;

    input.value = "";

    const aiDiv = document.createElement("div");
    aiDiv.className = "message ai";
    aiDiv.innerHTML = "<b>📻 رادیو:</b> ";
    chat.appendChild(aiDiv);

    window.scrollTo(0, document.body.scrollHeight);

    try {

        const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text })
        });

        const data = await res.json();

        // تایپ زنده پاسخ
        typeWriter(data.reply, aiDiv);

    } catch {

        aiDiv.innerHTML += "خطا در ارتباط با رادیو";

    }
}
</script>

</body>
</html>
