<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio AI</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600&display=swap" rel="stylesheet">

<style>
html, body {
    margin:0;
    padding:0;
    height:100%;
    font-family:'Vazirmatn', sans-serif;
    background:#1c1c1e;
    overflow:hidden;
}

/* ================= APP CONTAINER ================= */

.app {
    display:flex;
    flex-direction:column;
    height:100dvh;
    max-width:500px;
    margin:auto;
    background:#1c1c1e;
}

/* ================= HEADER ================= */

.header {
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#2c2c2e;
    color:white;
    font-weight:600;
    font-size:16px;
    position:relative;
}

.status-dot {
    width:8px;
    height:8px;
    background:#4caf50;
    border-radius:50%;
    position:absolute;
    left:16px;
}

/* ================= CHAT AREA ================= */

.chat-area {
    flex:1;
    overflow-y:auto;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

/* ================= MESSAGE ================= */

.message {
    max-width:75%;
    padding:12px 14px;
    border-radius:18px;
    font-size:14px;
    line-height:1.8;
    word-wrap:break-word;
}

/* پیام کاربر */
.user {
    align-self:flex-end;
    background:#7b61ff;
    color:white;
    border-bottom-right-radius:6px;
}

/* پیام رادیو */
.ai {
    align-self:flex-start;
    background:#3a3a3c;
    color:white;
    border-bottom-left-radius:6px;
}

/* ================= INPUT AREA ================= */

.input-area {
    height:65px;
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px;
    background:#2c2c2e;
}

input {
    flex:1;
    padding:10px 14px;
    border-radius:20px;
    border:none;
    font-family:'Vazirmatn';
    font-size:14px;
    background:#3a3a3c;
    color:white;
}

button {
    background:#7b61ff;
    border:none;
    color:white;
    padding:10px 16px;
    border-radius:20px;
    cursor:pointer;
    font-family:'Vazirmatn';
}

/* اسکرول نرم */
.chat-area::-webkit-scrollbar {
    width:6px;
}
.chat-area::-webkit-scrollbar-thumb {
    background:#444;
    border-radius:3px;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="status-dot"></div>
        🎙️ Radio AI Live
    </div>

    <div id="chat" class="chat-area"></div>

    <div class="input-area">
        <input id="message" placeholder="پیام خود را بنویسید..." />
        <button onclick="sendMessage()">ارسال</button>
    </div>

</div>

<script>

const SESSION_ID = crypto.randomUUID();

/* ================= ADD MESSAGE ================= */

function addMessage(role, text="") {

    const chat = document.getElementById("chat");

    const div = document.createElement("div");
    div.className = "message " + role;
    div.innerHTML = text;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;

    return div;
}

/* ================= TYPE EFFECT ================= */

function typeWriter(text, element) {
    let i=0;
    function typing(){
        if(i<text.length){
            element.innerHTML += text.charAt(i);
            i++;
            setTimeout(typing,15);
        }
    }
    typing();
}

/* ================= SEND ================= */

document.getElementById("message")
.addEventListener("keydown", e=>{
    if(e.key==="Enter") sendMessage();
});

async function sendMessage(){

    const input=document.getElementById("message");
    const text=input.value.trim();
    if(!text) return;

    addMessage("user", text);
    input.value="";

    const aiDiv = addMessage("ai","");

    try{

        const res = await fetch("/api/chat",{
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({
                message:text,
                session_id:SESSION_ID
            })
        });

        const data = await res.json();

        typeWriter(data.reply, aiDiv);

    }catch{
        aiDiv.innerHTML = "خطا در ارتباط با رادیو";
    }
}

/* ================= START ================= */

window.onload = async ()=>{

    const aiDiv = addMessage("ai","");

    const res = await fetch("/api/chat",{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({
            message:"شروع",
            session_id:SESSION_ID
        })
    });

    const data = await res.json();

    typeWriter(data.reply, aiDiv);
};

</script>

</body>
</html>
