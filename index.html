<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio AI</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Vazirmatn',sans-serif;
}

body{
    background:#121212;
    color:white;
    height:100vh;
    display:flex;
    justify-content:center;
}

.app{
    width:100%;
    max-width:500px;
    height:100vh;
    display:flex;
    flex-direction:column;
    background:#1c1c1e;
}

/* HEADER */

.header{
    padding:16px;
    background:#2c2c2e;
    text-align:center;
    font-weight:600;
    font-size:16px;
}

/* CREDITS */

.credits{
    text-align:center;
    font-size:12px;
    color:#aaa;
    padding:8px 0;
    background:#1c1c1e;
}

/* VOICE PICKER */

.voice-picker{
    padding:10px;
    display:flex;
    gap:10px;
    overflow-x:auto;
    background:#1c1c1e;
}

.voice-card{
    min-width:150px;
    background:#2c2c2e;
    padding:10px;
    border-radius:14px;
    display:flex;
    gap:8px;
    cursor:pointer;
    transition:.2s;
    border:2px solid transparent;
}

.voice-card.active{
    border:2px solid #6a5acd;
    background:#3a3a3c;
}

.avatar{
    font-size:22px;
}

.voice-name{
    font-weight:600;
    font-size:13px;
}

.voice-desc{
    font-size:11px;
    opacity:.6;
}

/* CHAT */

.chat-area{
    flex:1;
    overflow-y:auto;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.message{
    padding:12px 14px;
    border-radius:16px;
    max-width:80%;
    font-size:14px;
    line-height:1.8;
}

.user{
    align-self:flex-start;
    background:#2c2c2e;
}

.ai{
    align-self:flex-end;
    background:#6a5acd;
    color:white;
}

/* AUDIO */

.audio-wrapper{
    background:#6a5acd;
    padding:12px;
    border-radius:16px;
    max-width:80%;
    align-self:flex-end;
}

audio{
    width:100%;
    margin-top:8px;
}

.download-btn{
    display:inline-block;
    margin-top:8px;
    padding:6px 12px;
    background:white;
    color:black;
    border-radius:8px;
    font-size:12px;
    text-decoration:none;
}

/* INPUT */

.input-area{
    padding:12px;
    background:#2c2c2e;
    display:flex;
    gap:8px;
}

input{
    flex:1;
    padding:10px;
    border:none;
    border-radius:20px;
    font-size:14px;
}

button{
    padding:10px 16px;
    border:none;
    border-radius:20px;
    background:#6a5acd;
    color:white;
    cursor:pointer;
}

@media(max-width:600px){
    .app{
        max-width:100%;
    }
}

</style>
</head>

<body>

<div class="app">

    <div class="header">
        🎙️ اولین رادیوی هوش مصنوعی جهان
    </div>

    <div class="credits">
        طراحی و اجرا: سعید بهادری<br>
        مجری طرح: زهرا قاعدی<br>
        گرافیک: لادن ره‌آرد
    </div>

    <!-- VOICE PICKER -->

    <div class="voice-picker">

        <div class="voice-card active" data-voice="alloy">
            <div class="avatar">👨</div>
            <div>
                <div class="voice-name">مرد رسمی</div>
                <div class="voice-desc">اخباری، جدی</div>
            </div>
        </div>

        <div class="voice-card" data-voice="verse">
            <div class="avatar">👩</div>
            <div>
                <div class="voice-name">زن ملایم</div>
                <div class="voice-desc">آرام، صمیمی</div>
            </div>
        </div>

        <div class="voice-card" data-voice="echo">
            <div class="avatar">🎙</div>
            <div>
                <div class="voice-name">مرد گرم</div>
                <div class="voice-desc">رادیویی، احساسی</div>
            </div>
        </div>

        <div class="voice-card" data-voice="nova">
            <div class="avatar">🎧</div>
            <div>
                <div class="voice-name">زن جدی</div>
                <div class="voice-desc">مستند، رسمی</div>
            </div>
        </div>

    </div>

    <div id="chat" class="chat-area"></div>

    <div class="input-area">
        <input id="message" placeholder="پاسخ خود را بنویسید..." />
        <button onclick="sendMessage()">ارسال</button>
    </div>

</div>

<script>

const SESSION_ID = crypto.randomUUID();
let selectedVoice = "alloy";

/* VOICE SELECTOR */

document.querySelectorAll(".voice-card").forEach(card=>{
    card.addEventListener("click",()=>{
        document.querySelectorAll(".voice-card")
        .forEach(c=>c.classList.remove("active"));

        card.classList.add("active");
        selectedVoice = card.dataset.voice;
    });
});

/* ADD MESSAGE */

function addMessage(role,text){
    const chat=document.getElementById("chat");
    const div=document.createElement("div");
    div.className="message "+role;
    div.innerText=text;
    chat.appendChild(div);
    chat.scrollTop=chat.scrollHeight;
}

/* ADD AUDIO */

function addAudioPlayer(url){
    const chat=document.getElementById("chat");

    const wrapper=document.createElement("div");
    wrapper.className="audio-wrapper";

    wrapper.innerHTML=`
        🎧 خروجی صوتی
        <audio controls autoplay src="${url}"></audio>
        <a class="download-btn" href="${url}" download>دانلود فایل صوتی</a>
    `;

    chat.appendChild(wrapper);
    chat.scrollTop=chat.scrollHeight;
}

/* CHAT */

async function sendMessage(){

    const input=document.getElementById("message");
    const text=input.value.trim();
    if(!text) return;

    addMessage("user",text);
    input.value="";

    try{

        const res=await fetch("/api/chat",{
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({
                message:text,
                session_id:SESSION_ID,
                voice:selectedVoice
            })
        });

        const data=await res.json();

        addMessage("ai",data.reply);

        if(data.audio_url){
            addAudioPlayer(data.audio_url);
        }

    }catch{
        addMessage("ai","خطا در ارتباط با رادیو");
    }
}

/* ENTER SEND */

document.getElementById("message")
.addEventListener("keydown",e=>{
    if(e.key==="Enter") sendMessage();
});

/* START */

window.onload=async()=>{
    const res=await fetch("/api/chat",{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({
            message:"شروع",
            session_id:SESSION_ID,
            voice:selectedVoice
        })
    });

    const data=await res.json();
    addMessage("ai",data.reply);
};

</script>

</body>
</html>
