<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Radio AI</title>

<style>
html, body {
    margin:0;
    padding:0;
    height:100%;
    background:black;
    color:white;
    font-family:sans-serif;
    overflow:hidden; /* جلوگیری از اسکرول کل صفحه */
}

.app-container {
    display:flex;
    flex-direction:column;
    height:100vh; /* کل ارتفاع صفحه */
    max-width:900px;
    margin:auto;
}

.header {
    padding:20px;
    border-bottom:1px solid #222;
    text-align:center;
    flex-shrink:0; /* ثابت بمونه */
}

.header h1 {
    margin:0;
    font-size:28px;
}

#status {
    margin-top:8px;
    opacity:.7;
    font-size:14px;
}

.credits {
    margin-top:6px;
    font-size:13px;
    opacity:0.6;
}

.main {
    flex:1; /* فضای باقی‌مانده رو بگیره */
    overflow-y:auto; /* فقط این بخش اسکرول بشه */
    padding:20px;
}

.chat-box {
    max-width:700px;
    margin:auto;
    text-align:right;
}

.message {
    margin:12px 0;
    padding:14px;
    border-radius:10px;
    background:#111;
    line-height:1.9;
}

.user { background:#1a1a1a; }

.ai {
    background:#0f0f0f;
    border-right:3px solid #ffffff33;
}

.footer {
    padding:20px;
    border-top:1px solid #222;
    display:flex;
    gap:10px;
    flex-shrink:0; /* ثابت بمونه */
}

input {
    flex:1;
    padding:12px;
    font-size:16px;
    border:none;
    border-radius:6px;
}

button {
    padding:12px 20px;
    font-size:16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    background:white;
    color:black;
}

audio {
    margin-top:15px;
    width:100%;
}
</style>
</head>

<body>

<div class="app-container">

    <header class="header">
        <h1>🎙️ اولین رادیوی هوش مصنوعی</h1>
        <div id="status">در حال اتصال به رادیو...</div>
        <div class="credits">
            طراحی و اجرا: <strong>سعید بهادری</strong> —
            مجری طرح: <strong>زهرا قاعدی</strong>
        </div>
    </header>

    <main class="main">
        <div id="chat" class="chat-box"></div>
    </main>

    <footer class="footer">
        <input id="message" placeholder="پاسخ خود را بنویسید..." />
        <button onclick="sendMessage()">ارسال</button>
    </footer>

</div>

<script>
const SESSION_ID = crypto.randomUUID();

/* ---------- STATUS ---------- */
async function checkStatus(){
    try{
        const res = await fetch("/api/status");
        const data = await res.json();
        document.getElementById("status").innerText =
            "وضعیت رادیو: " + data.radio;
    }catch{
        document.getElementById("status").innerText =
            "ارتباط با رادیو برقرار نشد";
    }
}
checkStatus();

/* ---------- ENTER SEND ---------- */
document.getElementById("message")
.addEventListener("keydown", e=>{
    if(e.key==="Enter") sendMessage();
});

/* ---------- TYPEWRITER ---------- */
function typeWriter(text, element){
    let i=0;
    function typing(){
        if(i<text.length){
            element.innerHTML += text.charAt(i);
            i++;
            setTimeout(typing,15);
        }
    }
    typing();
}

/* ---------- ADD MESSAGE ---------- */
function addMessage(role,text=""){
    const chat=document.getElementById("chat");
    const div=document.createElement("div");
    div.className="message "+role;

    if(role==="user")
        div.innerHTML=`<b>🎧 شما:</b> ${text}`;
    else
        div.innerHTML=`<b>📻 رادیو:</b> `;

    chat.appendChild(div);

    // اسکرول فقط داخل main
    document.querySelector(".main").scrollTop =
        document.querySelector(".main").scrollHeight;

    return div;
}

/* ---------- ADD AUDIO ---------- */
function addAudioPlayer(url){
    const chat=document.getElementById("chat");
    const wrapper=document.createElement("div");
    wrapper.className="message ai";
    wrapper.innerHTML = `
        <b>🎧 خروجی صوتی:</b><br>
        <audio controls autoplay src="${url}"></audio>
    `;
    chat.appendChild(wrapper);
}

/* ---------- CHAT ---------- */
async function sendMessage(){

    const input=document.getElementById("message");
    const text=input.value.trim();
    if(!text) return;

    addMessage("user",text);
    input.value="";

    const aiDiv=addMessage("ai");

    try{
        const res=await fetch("/api/chat",{
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({
                message:text,
                session_id:SESSION_ID
            })
        });

        const data=await res.json();

        typeWriter(data.reply,aiDiv);

        if(data.audio_url){
            setTimeout(()=>{
                addAudioPlayer(data.audio_url);
            },800);
        }

    }catch{
        aiDiv.innerHTML+="خطا در ارتباط با رادیو";
    }
}

/* ---------- START ---------- */
window.onload=async()=>{
    const aiDiv=addMessage("ai");
    const res=await fetch("/api/chat",{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({
            message:"شروع",
            session_id:SESSION_ID
        })
    });
    const data=await res.json();
    typeWriter(data.reply,aiDiv);
};
</script>

</body>
</html>
