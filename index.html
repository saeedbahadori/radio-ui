<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Radio AI</title>

<style>
    body {
        background: black;
        color: white;
        text-align: center;
        font-family: sans-serif;
        margin-top: 100px;
    }

    h1 {
        font-size: 42px;
        margin-bottom: 20px;
    }

    h2 {
        font-weight: normal;
        opacity: 0.85;
    }

    .credit {
        margin-top: 40px;
        font-size: 18px;
        opacity: 0.7;
        line-height: 1.8;
    }

    .chat-box {
        margin: 40px auto;
        max-width: 600px;
        text-align: right;
    }

    .message {
        margin: 10px 0;
        padding: 10px;
        border-radius: 8px;
        background: #111;
    }

    input {
        padding: 12px;
        width: 65%;
        font-size: 16px;
        border: none;
        border-radius: 6px;
    }

    button {
        padding: 12px 20px;
        font-size: 16px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        background: #ffffff;
        color: black;
    }
</style>
</head>

<body>

<h1>🎙️ اولین رادیوی هوش مصنوعی در جهان</h1>

<h2 id="status">در حال اتصال به رادیو...</h2>

<div class="credit">
    <div>طراح: <strong>سعید بهادری</strong></div>
    <div>سفارش پروژه: <strong>زهرا قاعدی</strong></div>
</div>


<!-- ===== CHAT UI ===== -->

<div style="margin-top:50px;">
    <input id="message" placeholder="پیام خود را بنویسید..." />
    <button onclick="sendMessage()">ارسال</button>
</div>

<div id="chat" class="chat-box"></div>


<script>
/* ---------- وضعیت رادیو ---------- */
async function checkStatus() {
    try {
        const res = await fetch("/api/status");
        const data = await res.json();
        document.getElementById("status").innerText =
            "وضعیت رادیو: " + data.radio;
    } catch {
        document.getElementById("status").innerText =
            "ارتباط با رادیو برقرار نشد";
    }
}

checkStatus();


/* ---------- CHAT ---------- */
async function sendMessage() {

    const input = document.getElementById("message");
    const chat = document.getElementById("chat");

    const text = input.value.trim();
    if (!text) return;

    // پیام کاربر
    chat.innerHTML += `
        <div class="message"><b>شما:</b> ${text}</div>
    `;

    input.value = "";

    try {
        const res = await fetch("/api/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ message: text })
        });

        const data = await res.json();

        // پاسخ رادیو
        chat.innerHTML += `
            <div class="message"><b>Radio AI:</b> ${data.reply}</div>
        `;

        window.scrollTo(0, document.body.scrollHeight);

    } catch {
        chat.innerHTML += `
            <div class="message">خطا در ارتباط با رادیو</div>
        `;
    }
}
</script>

</body>
</html>
