<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio AI</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Vazirmatn',sans-serif;
}

body{
    background:#121212;
    color:white;
    height:100vh;
    display:flex;
    justify-content:center;
}

.app{
    width:100%;
    max-width:500px;
    height:100vh;
    display:flex;
    flex-direction:column;
    background:#1c1c1e;
}

/* ---------- HEADER ---------- */

.header{
    padding:16px;
    background:#2c2c2e;
    text-align:center;
    font-weight:600;
    font-size:16px;
}

/* ---------- CREDITS ---------- */

.credits{
    text-align:center;
    font-size:12px;
    color:#aaa;
    padding:8px 0;
    background:#1c1c1e;
}

/* ---------- CHAT AREA ---------- */

.chat-area{
    flex:1;
    overflow-y:auto;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

/* ---------- MESSAGES ---------- */

.message{
    padding:12px 14px;
    border-radius:16px;
    max-width:80%;
    font-size:14px;
    line-height:1.8;
}

.user{
    align-self:flex-start;
    background:#2c2c2e;
}

.ai{
    align-self:flex-end;
    background:#6a5acd;
    color:white;
}

/* ---------- AUDIO BLOCK ---------- */

.audio-wrapper{
    background:#6a5acd;
    padding:12px;
    border-radius:16px;
    max-width:80%;
    align-self:flex-end;
}

audio{
    width:100%;
    margin-top:8px;
}

.download-btn{
    display:inline-block;
    margin-top:8px;
    padding:6px 12px;
    background:white;
    color:black;
    border-radius:8px;
    font-size:12px;
    text-decoration:none;
}

/* ---------- INPUT AREA ---------- */

.input-area{
    padding:12px;
    background:#2c2c2e;
    display:flex;
    gap:8px;
}

input{
    flex:1;
    padding:10px;
    border:none;
    border-radius:20px;
    font-size:14px;
}

button{
    padding:10px 16px;
    border:none;
    border-radius:20px;
    background:#6a5acd;
    color:white;
    cursor:pointer;
}

/* ---------- MOBILE FIX ---------- */

@media(max-width:600px){
    .app{
        max-width:100%;
    }
}

</style>
</head>

<body>

<div class="app">

    <div class="header">
        🎙️ اولین رادیوی هوش مصنوعی جهان
    </div>

    <div class="credits">
        طراحی و اجرا: سعید بهادری<br>
        مجری طرح: زهرا قاعدی<br>
        گرافیک: لادن ره‌آرد
    </div>

    <div id="chat" class="chat-area"></div>

    <div class="input-area">
        <input id="message" placeholder="پاسخ خود را بنویسید..." />
        <button onclick="sendMessage()">ارسال</button>
    </div>

</div>

<script>

const SESSION_ID = crypto.randomUUID();

/* ---------- ADD MESSAGE ---------- */

function addMessage(role,text){
    const chat=document.getElementById("chat");

    const div=document.createElement("div");
    div.className="message "+role;
    div.innerText=text;

    chat.appendChild(div);
    chat.scrollTop=chat.scrollHeight;
}

/* ---------- ADD AUDIO ---------- */

function addAudioPlayer(url){

    const chat=document.getElementById("chat");

    const wrapper=document.createElement("div");
    wrapper.className="audio-wrapper";

    wrapper.innerHTML=`
        🎧 خروجی صوتی
        <audio controls autoplay src="${url}"></audio>
        <a class="download-btn" href="${url}" download>دانلود فایل صوتی</a>
    `;

    chat.appendChild(wrapper);
    chat.scrollTop=chat.scrollHeight;
}

/* ---------- CHAT ---------- */

async function sendMessage(){

    const input=document.getElementById("message");
    const text=input.value.trim();
    if(!text) return;

    addMessage("user",text);
    input.value="";

    try{

        const res=await fetch("/api/chat",{
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({
                message:text,
                session_id:SESSION_ID
            })
        });

        const data=await res.json();

        addMessage("ai",data.reply);

        if(data.audio_url){
            addAudioPlayer(data.audio_url);
        }

    }catch{
        addMessage("ai","خطا در ارتباط با رادیو");
    }
}

/* ---------- ENTER SEND ---------- */

document.getElementById("message")
.addEventListener("keydown",e=>{
    if(e.key==="Enter") sendMessage();
});

/* ---------- START ---------- */

window.onload=async()=>{

    const res=await fetch("/api/chat",{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({
            message:"شروع",
            session_id:SESSION_ID
        })
    });

    const data=await res.json();
    addMessage("ai",data.reply);
};

</script>

</body>
</html>
