<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Vazirmatn',sans-serif;
}

body{
    background:#121212;
    color:white;
    height:100vh;
    display:flex;
    justify-content:center;
}

.app{
    width:100%;
    max-width:500px;
    height:100vh;
    display:flex;
    flex-direction:column;
    background:#1c1c1e;
}

/* HEADER */

.header{
    padding:16px;
    background:#2c2c2e;
    text-align:center;
    font-weight:600;
}

.credits{
    text-align:center;
    font-size:12px;
    color:#aaa;
    padding:8px 0;
}

/* CHAT */

.chat-area{
    flex:1;
    overflow-y:auto;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.message{
    padding:14px;
    border-radius:16px;
    max-width:85%;
    line-height:1.9;
    text-align:justify;
    white-space:pre-line;
}

.user{
    align-self:flex-start;
    background:#2c2c2e;
}

.ai{
    align-self:flex-end;
    background:#6a5acd;
}

/* VOICE */

.voice-container{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:8px;
}

.voice-card{
    background:#2c2c2e;
    padding:8px 12px;
    border-radius:12px;
    cursor:pointer;
    transition:.2s;
}

.voice-card:hover{
    background:#6a5acd;
}

/* AUDIO */

.audio-wrapper{
    background:#6a5acd;
    padding:12px;
    border-radius:16px;
    max-width:85%;
    align-self:flex-end;
}

audio{
    width:100%;
    margin-top:8px;
}

/* INPUT */

.input-area{
    padding:12px;
    background:#2c2c2e;
    display:flex;
    gap:8px;
}

input{
    flex:1;
    padding:10px;
    border:none;
    border-radius:20px;
}

button{
    padding:10px 16px;
    border:none;
    border-radius:20px;
    background:#6a5acd;
    color:white;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="app">

<div class="header">
🎙️ اولین رادیوی هوش مصنوعی جهان
</div>

<div class="credits">
طراحی و اجرا: سعید بهادری<br>
مجری طرح: زهرا قاعدی<br>
گرافیک: لادن ره‌آرد
</div>

<div id="chat" class="chat-area"></div>

<div class="input-area">
<input id="message" placeholder="پاسخ خود را بنویسید..." />
<button onclick="sendMessage()">ارسال</button>
</div>

</div>

<script>

const SESSION_ID = crypto.randomUUID();

/* TYPEWRITER */

function typeWriter(text, element){
    let i = 0;
    function typing(){
        if(i < text.length){
            if(text[i] === "\n"){
                element.innerHTML += "<br>";
            } else {
                element.innerHTML += text[i];
            }
            i++;
            setTimeout(typing, 30); // سرعت منطقی‌تر
        }
    }
    typing();
}

/* ADD MESSAGE */

function addMessage(role,text){
    const chat=document.getElementById("chat");
    const div=document.createElement("div");
    div.className="message "+role;
    chat.appendChild(div);
    typeWriter(text, div);
    chat.scrollTop=chat.scrollHeight;
    return div;
}

/* VOICE OPTIONS */

function addVoiceOptions(){

    const chat=document.getElementById("chat");

    const container=document.createElement("div");
    container.className="voice-container";

    const voices={
        alloy:"👨 مرد رسمی",
        verse:"👩 زن ملایم",
        echo:"🎙 مرد گرم",
        nova:"🎧 زن جدی"
    };

    for(const key in voices){
        const btn=document.createElement("div");
        btn.className="voice-card";
        btn.innerText=voices[key];
        btn.onclick=()=>generateAudio(key);
        container.appendChild(btn);
    }

    chat.appendChild(container);
    chat.scrollTop=chat.scrollHeight;
}

/* AUDIO */

function addAudioPlayer(url){

    const chat=document.getElementById("chat");

    const wrapper=document.createElement("div");
    wrapper.className="audio-wrapper";

    wrapper.innerHTML=`
        🎧 خروجی صوتی
        <audio controls autoplay src="${url}"></audio>
    `;

    chat.appendChild(wrapper);
    chat.scrollTop=chat.scrollHeight;
}

/* GENERATE AUDIO */

async function generateAudio(voice){

    const res=await fetch("/api/chat",{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({
            message:"انتخاب صدا",
            session_id:SESSION_ID,
            voice:voice
        })
    });

    const data=await res.json();

    addMessage("ai", data.reply);

    if(data.audio_url){
        addAudioPlayer(data.audio_url);
    }
}

/* SEND MESSAGE */

async function sendMessage(){

    const input=document.getElementById("message");
    const text=input.value.trim();
    if(!text) return;

    addMessage("user",text);
    input.value="";

    const res=await fetch("/api/chat",{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({
            message:text,
            session_id:SESSION_ID
        })
    });

    const data=await res.json();

    addMessage("ai",data.reply);

    // اگر وارد مرحله انتخاب صدا شد
    if(data.reply.includes("پخش شود")){
        addVoiceOptions();
    }
}

/* ENTER KEY */

document.getElementById("message")
.addEventListener("keydown", e=>{
    if(e.key==="Enter"){
        e.preventDefault();
        sendMessage();
    }
});

/* START */

window.onload=async()=>{
    const res=await fetch("/api/chat",{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({
            message:"شروع",
            session_id:SESSION_ID
        })
    });

    const data=await res.json();
    addMessage("ai",data.reply);
};

</script>

</body>
</html>
